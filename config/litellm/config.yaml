model_list:
  # ═══════════════════════════════════════════════════════════════════════════
  # Google Gemma 4 31B - Main Chat Model (used by all services)
  # Each API key is a separate deployment with proper metadata for router tracking
  # ═══════════════════════════════════════════════════════════════════════════
  - model_name: google/gemma-4-31b-it
    litellm_params:
      model: openai/google/gemma-4-31b-it
      api_base: "https://integrate.api.nvidia.com/v1"
      api_key: "os.environ/NVIDIA_API_KEY_1"
      metadata:
        deployment: nvidia-key1
        priority: 1
    model_info:
      id: nvidia-gemma-key1
      
