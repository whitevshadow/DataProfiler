router_settings:
  routing_strategy: simple-shuffle     # simple round-robin - most reliable
  num_retries: 100                  # try each deployment once before returning failure
  timeout: 300                     # keep failed calls from occupying memory for minutes
  retry_after: 1                       # 1 second between each attempt
  allowed_fails: 100                   # avoid endless retries on bad keys/deployments
  cooldown_time: 5                   # give failing deployments time to recover
  fallbacks: []

litellm_settings:
  cache: false                   # avoid unbounded in-memory prompt/response cache
  cache_params:
    type: local                       # no Redis needed
    ttl: 300                          # cache identical prompts for 5 min
  drop_params: true                   # silently ignore unsupported params
  request_timeout: 300              # cap request lifetime under normal interactive use
  max_parallel_requests: 1000          # local profiler UI should not need hundreds of in-flight calls
  num_retries: 100                # match router retry budget
  retry_policy: "exponential_backoff_retry"  # exponential backoff on rate limits

general_settings:
  # master_key: sk-litellm-master-change-me  # Disabled - all services are internal
  proxy_base_url: http://litellm-proxy:4000
  request_timeout: 300



